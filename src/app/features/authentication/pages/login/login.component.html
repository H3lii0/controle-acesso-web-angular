<main class="login-page">
  <header class="public-bar">
    <div class="brand">
      <span class="brand-icon"><svg [lucideIcon]="icons.shield" size="21"></svg></span>
      <div><strong>Colégio Horizonte</strong><small>Controle de acesso escolar</small></div>
    </div>
    <a href="mailto:suporte@colegio.local"><svg [lucideIcon]="icons.help" size="17"></svg> Precisa de ajuda?</a>
  </header>

  <section class="login-area">
    <div class="login-card">
      <div class="access-icon"><svg [lucideIcon]="icons.lock" size="25"></svg></div>
      <div class="login-title">
        <h1>Acesso ao sistema</h1>
        <p>Entre com suas credenciais para continuar.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span>E-mail</span>
          <span class="field-with-icon">
            <svg [lucideIcon]="icons.email" size="17"></svg>
            <input class="control" type="email" formControlName="email" autocomplete="email" placeholder="seu@email.com" />
          </span>
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small class="field-error">Informe um e-mail válido.</small>
          }
        </label>

        <label class="field">
          <span>Senha</span>
          <span class="field-with-icon password">
            <svg [lucideIcon]="icons.lock" size="17"></svg>
            <input class="control" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Digite sua senha" />
            <button class="password-toggle" type="button" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
              <svg [lucideIcon]="showPassword() ? icons.hide : icons.show" size="17"></svg>
            </button>
          </span>
        </label>

        <div class="login-options">
          <label class="remember"><input type="checkbox" /> <span>Lembrar de mim</span></label>
          <button type="button" class="link">Esqueci minha senha</button>
        </div>

        @if (errorMessage) {
          <p class="form-error" role="alert">{{ errorMessage }}</p>
        }

        <button class="button sign-in" type="submit" [disabled]="submitting">
          {{ submitting ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>

      <div class="demo-environment"><span></span> Ambiente de demonstração</div>
    </div>
  </section>

  <footer>© 2026 Colégio Horizonte <span>Privacidade</span><span>Termos de uso</span></footer>
</main>
