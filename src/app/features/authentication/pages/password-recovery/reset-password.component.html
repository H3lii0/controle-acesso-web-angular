<main class="activation-page">
  <header class="public-bar"><div class="brand"><span class="brand-icon"><svg [lucideIcon]="icons.shield" size="21"></svg></span><div><strong>Colégio Horizonte</strong><small>Controle de acesso escolar</small></div></div><a routerLink="/login"><svg [lucideIcon]="icons.help" size="17"></svg> Voltar para o login</a></header>
  <section class="activation-area"><div class="activation-card"><div class="access-icon"><svg [lucideIcon]="icons.lock" size="25"></svg></div><div class="activation-title"><h1>Defina uma nova senha</h1><p>Crie uma senha nova para continuar usando o sistema.</p></div>
    @if (!token || !email) { <p class="form-error">O link de recuperação não possui os dados necessários.</p> }<form [formGroup]="form" (ngSubmit)="submit()" novalidate><label class="field"><span>Nova senha</span><input class="control" type="password" formControlName="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" />@if (form.controls.password.touched && form.controls.password.invalid) { <small class="field-error">A senha deve ter pelo menos 8 caracteres.</small> }</label><label class="field"><span>Confirmar senha</span><input class="control" type="password" formControlName="password_confirmation" autocomplete="new-password" placeholder="Repita sua senha" /></label>@if (errorMessage) { <p class="form-error" role="alert">{{ errorMessage }}</p> }<button class="button" type="submit" [disabled]="submitting || !token || !email">{{ submitting ? 'Salvando...' : 'Salvar nova senha' }}</button></form>
  </div></section><footer>© 2026 Colégio Horizonte</footer>
</main>
